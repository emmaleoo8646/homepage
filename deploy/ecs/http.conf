server {
    listen 80;
    listen [::]:80;
    server_name home.douwuyou.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # No private content or password challenge over unencrypted HTTP.
    location / {
        return 308 https://home.douwuyou.cn$request_uri;
    }
}
