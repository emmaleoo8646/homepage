server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    auth_basic "My private homepage";
    auth_basic_user_file /etc/nginx/home.htpasswd;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "private, no-store" always;
    access_log off;

    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve build metadata or dotfiles.
    location ~ /\. { return 404; }
    location = /vinext-client-entry-manifest.json { return 404; }
    location = /_headers { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
