server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name home.douwuyou.cn;
    ssl_certificate /etc/letsencrypt/live/home.douwuyou.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.douwuyou.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $homepage_upstream homepage-web:80;
        proxy_pass http://$homepage_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
