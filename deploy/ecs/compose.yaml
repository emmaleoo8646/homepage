name: homepage
services:
  web:
    image: nginx:1.30.5-alpine3.24
    container_name: homepage-web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/home.htpasswd:/etc/nginx/home.htpasswd:ro
    networks:
      - edge
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  edge:
    external: true
    name: family-diary_edge
